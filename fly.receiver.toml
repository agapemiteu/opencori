# Mock Wema receiver. Deploy with:
#   fly deploy -c fly.receiver.toml
#
# Deploy this one first. The control API points at its address.

app = "corri-mock-wema-receiver"
primary_region = "lhr"

[build]
dockerfile = "Dockerfile"

[build.args]
APP = "@corri/mock-wema-receiver"

[env]
NODE_ENV = "production"
PORT = "8080"

[http_service]
internal_port = 8080
force_https = true
# State lives in memory, so keep exactly one machine and never stop it.
auto_stop_machines = "off"
auto_start_machines = true
min_machines_running = 1

[[http_service.checks]]
interval = "30s"
timeout = "5s"
grace_period = "15s"
method = "GET"
path = "/v1/wema/messages"

[[vm]]
size = "shared-cpu-1x"
memory = "512mb"
