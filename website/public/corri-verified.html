<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#4b0b72"><title>Corri by Wema</title><style>:root{--p:#4b0b72;--p2:#7a2eb0;--o:#f58220;--bg:#faf8fb;--ink:#201523;--muted:#756b79;--line:#e7dfea;--green:#176b51;--greenbg:#e8f5ef}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#160420;color:var(--ink)}button,textarea{font:inherit}.shell{min-height:100dvh;display:grid;place-items:center;padding:14px}.phone{position:relative;width:min(420px,100%);height:min(870px,calc(100dvh - 18px));overflow:hidden;display:flex;flex-direction:column;background:var(--bg);border:8px solid #0d0b0f;border-radius:44px;box-shadow:0 30px 100px rgba(0,0,0,.55)}.top{height:66px;background:#fff;border-bottom:1px solid var(--line);display:grid;grid-template-columns:44px 1fr 44px;align-items:end;padding:0 12px 10px;z-index:5}.top button{height:36px;border:0;background:transparent;color:var(--p);border-radius:11px;display:grid;place-items:center;cursor:pointer}.brand{text-align:center;color:var(--p);font-weight:950;font-size:21px;letter-spacing:-.8px}.progress{height:3px;background:#eee8f1}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--o),var(--p2));transition:width .25s}.view{flex:1;overflow:auto;overscroll-behavior:contain}.screen{min-height:100%;padding:22px 18px 30px;animation:in .22s ease}@keyframes in{from{opacity:.15;transform:translateY(6px)}to{opacity:1;transform:none}}.screen.full{padding:0}.hero{height:350px;position:relative;overflow:hidden;background:linear-gradient(135deg,#67258e,#2b093f)}.hero img{width:100%;height:100%;object-fit:cover}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(19,4,29,.05) 25%,rgba(19,4,29,.95))}.heroCopy{position:absolute;z-index:2;left:18px;right:18px;bottom:18px;color:#fff}.sheet{position:relative;margin-top:-24px;border-radius:27px 27px 0 0;background:var(--bg);padding:25px 18px 30px;min-height:360px}.eyebrow{font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.13em;color:var(--p2);margin:0 0 8px}.dark{color:#eddcf6}h1,h2{margin:0;letter-spacing:-.045em;line-height:1.05}h1{font-size:31px}h2{font-size:28px}.lead{font-size:13px;line-height:1.5;color:var(--muted);margin:10px 0 18px}.lead.dark{color:#eee4f2}.stack{display:grid;gap:9px;margin-top:16px}.btn{width:100%;min-height:50px;border:0;border-radius:14px;padding:13px 15px;font-weight:850;cursor:pointer}.primary{background:linear-gradient(135deg,var(--p2),var(--p));color:#fff}.orange{background:var(--o);color:#fff}.secondary{background:#fff;color:var(--p);border:1px solid #dacfe1}.quiet{background:transparent;color:var(--muted)}.approach{min-height:100%;background:linear-gradient(180deg,#5c2180,#2b093f);color:#fff;padding:27px 18px 30px;display:flex;flex-direction:column}.approachTop{display:flex;justify-content:space-between;align-items:center;gap:12px}.status{display:inline-flex;align-items:center;gap:6px;padding:7px 9px;border-radius:999px;background:rgba(255,255,255,.12);font-size:9px;font-weight:900}.dot{width:7px;height:7px;border-radius:50%;background:currentColor}.radarWrap{flex:1;display:grid;place-items:center;min-height:290px}.radar{width:190px;height:190px;border-radius:50%;position:relative;display:grid;place-items:center}.ring{position:absolute;inset:0;border:1px solid rgba(255,255,255,.23);border-radius:50%;animation:pulse 2s infinite}.ring:nth-child(2){inset:24px;animation-delay:.3s}.ring:nth-child(3){inset:50px;animation-delay:.6s}@keyframes pulse{0%,100%{transform:scale(.94);opacity:.35}50%{transform:scale(1.04);opacity:1}}.pin{width:62px;height:62px;border-radius:20px;background:#fff;color:var(--p);display:grid;place-items:center;z-index:2;font-size:28px}.distance{font-size:54px;font-weight:950;letter-spacing:-.07em;margin-top:15px}.distance small{font-size:17px}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:14px;margin:12px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.row+.row{border-top:1px dashed var(--line);margin-top:10px;padding-top:10px}.label{font-size:10px;color:var(--muted)}.value{font-size:11px;font-weight:850;text-align:right;max-width:66%}.field{background:#fff;border:1px solid var(--line);border-radius:17px;padding:13px;margin:13px 0}.field textarea{width:100%;min-height:125px;border:0;outline:0;resize:none;background:transparent;font-size:13px;line-height:1.5;color:var(--ink)}.fieldFoot{display:flex;justify-content:space-between;align-items:center}.voice{border:0;border-radius:11px;padding:9px 11px;background:#f3ebf8;color:var(--p);font-size:10px;font-weight:850}.soft{background:#f3ebf8;border-radius:14px;padding:12px;font-size:10px;line-height:1.45;color:#5e5263;margin:13px 0}.tx{width:100%;display:flex;align-items:center;gap:10px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:15px;padding:13px;margin:8px 0}.tx.selected{background:#f7effb;border-color:#a67ac2}.radio{width:18px;height:18px;border:2px solid #cbb8d6;border-radius:50%;display:grid;place-items:center}.selected .radio:after{content:"";width:9px;height:9px;border-radius:50%;background:var(--p2)}.txCopy{flex:1}.tx b{display:block;font-size:11px}.tx small{display:block;font-size:9px;color:var(--muted);margin-top:3px}.tx strong{font-size:12px}.timer{font-size:44px;text-align:center;color:var(--p);font-weight:950;letter-spacing:-.06em;margin:23px 0}.success{width:76px;height:76px;border-radius:23px;background:var(--greenbg);color:var(--green);display:grid;place-items:center;margin:20px auto;font-size:34px}.case{background:#23043d;color:#fff;border-radius:18px;padding:16px;margin:16px 0}.case span{font-size:9px;color:#d9c5e4;text-transform:uppercase;letter-spacing:.1em}.case strong{display:block;font-size:28px;margin:5px 0}.timeline{border-left:2px solid #dac5e7;margin:18px 0 18px 10px;padding-left:17px}.item{position:relative;margin-bottom:17px}.item:before{content:"";position:absolute;left:-22px;top:4px;width:9px;height:9px;border-radius:50%;background:var(--p2)}.item b{font-size:11px}.item small{display:block;color:var(--muted);font-size:9px;margin-top:3px}.alert{position:absolute;inset:0;z-index:20;background:linear-gradient(180deg,rgba(18,3,28,.15),rgba(18,3,28,.87));padding:88px 14px 18px}.hidden{display:none}.incoming{background:#fff;border-radius:22px;padding:15px;box-shadow:0 25px 75px rgba(0,0,0,.4);animation:drop .34s ease}@keyframes drop{from{opacity:0;transform:translateY(-18px)}to{opacity:1;transform:none}}.incoming h3{font-size:16px;margin:13px 0 6px}.incoming p{font-size:11px;color:var(--muted);line-height:1.45}.appId{display:flex;gap:9px;align-items:center}.alat{width:35px;height:35px;border-radius:10px;background:var(--p);color:#fff;display:grid;place-items:center;font-size:10px;font-weight:950}.incomingActions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.incomingActions .wide{grid-column:1/-1}.countdown{text-align:center;font-size:9px;color:var(--muted);margin-top:9px}.toast{position:absolute;z-index:40;left:50%;bottom:18px;transform:translateX(-50%);background:#17131b;color:#fff;padding:10px 13px;border-radius:12px;font-size:10px;opacity:0;pointer-events:none;transition:.2s;white-space:nowrap}.toast.show{opacity:1}@media(max-width:520px){.shell{padding:0}.phone{width:100%;height:100dvh;border:0;border-radius:0}.top{height:calc(62px + env(safe-area-inset-top));padding-top:env(safe-area-inset-top)}.hero{height:40dvh;min-height:300px}}</style></head><body><main class="shell"><section class="phone"><header class="top"><button id="back" aria-label="Back">‹</button><div class="brand">corri</div><button id="home" aria-label="Home">⌂</button></header><div class="progress"><span id="bar"></span></div><div id="app" class="view"></div><div id="alert" class="alert hidden"></div><div id="toast" class="toast"></div></section></main><script>const PHOTO='https://cdn.guardian.ng/wp-content/uploads/2020/03/wema-bank-640x360-640x360.jpg',BRANCH={lat:6.453056,lng:3.395833,approach:420,entry:170};const initial=()=>({step:0,mode:null,distance:720,accuracy:18,intent:'',tx:null,outcome:'',visitStart:null,quietUntil:0});let s=initial(),approachTimer=null,visitTimer=null,alertTimer=null,geoWatch=null,audio=null,recognition=null;const app=document.querySelector('#app'),layer=document.querySelector('#alert'),bar=document.querySelector('#bar'),back=document.querySelector('#back'),home=document.querySelector('#home'),toastEl=document.querySelector('#toast');function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(t){toastEl.textContent=t;toastEl.classList.add('show');setTimeout(()=>toastEl.classList.remove('show'),1400)}function frame(h,full=false){app.innerHTML=`<section class="screen ${full?'full':''}">${h}</section>`;bar.style.width=`${Math.min(100,s.step*12)}%`;back.style.visibility=s.step===0?'hidden':'visible';app.scrollTop=0}function go(n){clearInterval(visitTimer);s.step=n;render();navigator.vibrate?.(15)}function unlock(){try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume?.()}catch{}}function beep(){try{unlock();if(!audio)return;const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=880;g.gain.setValueAtTime(.001,audio.currentTime);g.gain.exponentialRampToValueAtTime(.18,audio.currentTime+.02);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.22);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+.24)}catch{}}function updateApproach(){const d=document.querySelector('#distance'),st=document.querySelector('#status'),ac=document.querySelector('#accuracy');if(d)d.innerHTML=`${Math.round(s.distance)} <small>m</small>`;if(st)st.innerHTML=`<span class="dot"></span>${s.distance<=BRANCH.entry?'At branch':s.distance<=BRANCH.approach?'Near branch':'Approaching'}`;if(ac)ac.textContent=`±${Math.round(s.accuracy)} m`}function startDemo(){unlock();stopGeo();clearInterval(approachTimer);s={...initial(),step:1,mode:'demo'};render();approachTimer=setInterval(()=>{s.distance=Math.max(150,s.distance-64);updateApproach();if(s.distance<=BRANCH.entry){clearInterval(approachTimer);setTimeout(openAlert,350)}},460)}function metres(lat,lng){const R=6371000,a=lat*Math.PI/180,b=BRANCH.lat*Math.PI/180,x=(BRANCH.lat-lat)*Math.PI/180,y=(BRANCH.lng-lng)*Math.PI/180,h=Math.sin(x/2)**2+Math.cos(a)*Math.cos(b)*Math.sin(y/2)**2;return 2*R*Math.atan2(Math.sqrt(h),Math.sqrt(1-h))}async function startLive(){unlock();clearInterval(approachTimer);s={...initial(),step:1,mode:'live',distance:999,accuracy:999};render();if(!navigator.geolocation)return toast('Location is not supported here');if('Notification'in window&&Notification.permission==='default'){try{await Notification.requestPermission()}catch{}}stopGeo();geoWatch=navigator.geolocation.watchPosition(p=>{s.distance=metres(p.coords.latitude,p.coords.longitude);s.accuracy=Math.round(p.coords.accuracy||999);updateApproach();if(s.distance<=BRANCH.approach&&s.accuracy<=160&&Date.now()>=s.quietUntil)openAlert()},e=>toast(e.code===1?'Location permission was denied':'Location is temporarily unavailable'),{enableHighAccuracy:true,maximumAge:5000,timeout:15000})}function stopGeo(){if(geoWatch!==null&&navigator.geolocation){navigator.geolocation.clearWatch(geoWatch);geoWatch=null}}function openAlert(){if(!layer.classList.contains('hidden')||Date.now()<s.quietUntil)return;beep();navigator.vibrate?.([120,60,120]);let sec=12;layer.classList.remove('hidden');layer.innerHTML=`<div class="incoming"><div class="appId"><span class="alat">ALAT</span><div><b>Branch assistance</b><div class="label">Now</div></div></div><h3>You are close to Wema Marina.</h3><p>Do you need help with anything at this branch today?</p><div class="incomingActions"><button class="btn primary wide" data-alert="help">Yes, help me</button><button class="btn secondary" data-alert="later">Not now</button><button class="btn secondary" data-alert="away">I’m not visiting</button></div><div class="countdown" id="countdown">Closes in 12 seconds if ignored</div></div>`;clearInterval(alertTimer);alertTimer=setInterval(()=>{sec--;const c=document.querySelector('#countdown');if(c)c.textContent=`Closes in ${sec} seconds if ignored`;if(sec<=0)dismiss('ignored')},1000)}function closeAlert(){clearInterval(alertTimer);layer.classList.add('hidden');layer.innerHTML=''}function dismiss(r){closeAlert();s.quietUntil=Date.now()+(r==='away'?360:r==='later'?30:15)*60000;toast(r==='away'?'Branch alerts paused for 6 hours':'Corri will stay quiet for now')}function render(){if(s.step===0)return frame(`<div class="hero"><img src="${PHOTO}" alt="Wema Bank branch" onerror="this.style.display='none'"><div class="heroCopy"><p class="eyebrow dark">Corri by Wema</p><h1>Your branch visit, connected.</h1><p class="lead dark">A smoother ALAT journey from branch arrival to unresolved follow-up.</p></div></div><div class="sheet"><button class="btn primary" data-action="demo">Run the customer journey</button><button class="btn quiet" data-action="live">Try live location</button></div>`,true);if(s.step===1){frame(`<div class="approach"><div class="approachTop"><div><p class="eyebrow dark">${s.mode==='live'?'Live proximity':'Customer approaching'}</p><h2>Wema Marina</h2></div><span class="status" id="status"><span class="dot"></span>Approaching</span></div><div class="radarWrap"><div><div class="radar"><span class="ring"></span><span class="ring"></span><span class="ring"></span><div class="pin">⌖</div></div><div class="distance" id="distance">${Math.round(s.distance)} <small>m</small></div><p>Corri waits for a credible proximity signal before interrupting the customer.</p></div></div><div class="card"><div class="row"><span class="label">Location accuracy</span><span class="value" id="accuracy">±${Math.round(s.accuracy)} m</span></div></div><div class="stack"><button class="btn secondary" data-action="alert">Trigger alert now</button><button class="btn quiet" data-action="home">Stop</button></div></div>`,true);updateApproach();return}if(s.step===2)return frame(`<div class="hero"><img src="${PHOTO}" alt="Wema Bank branch"><div class="heroCopy"><p class="eyebrow dark">Branch assistance</p><h1>You are near Wema Marina.</h1></div></div><div class="sheet"><div class="card"><div class="appId"><span class="alat">ALAT</span><div><b>Good morning.</b><div class="label">Wema Marina</div></div></div><p class="lead">Do you need help with anything at this branch today?</p></div><div class="stack"><button class="btn orange" data-action="help">Yes, I need help</button><button class="btn secondary" data-action="later">Not now</button><button class="btn secondary" data-action="away">I’m not visiting</button></div></div>`,true);if(s.step===3)return frame(`<p class="eyebrow">Your words</p><h2>What brings you to the branch?</h2><p class="lead">Tell Wema in your own words. Corri does not guess the reason.</p><div class="field"><textarea id="intent" maxlength="400" placeholder="Example: I made a transfer this morning and the recipient has not received it.">${esc(s.intent)}</textarea><div class="fieldFoot"><button class="voice" data-action="voice-intent">Speak instead</button><span class="label"><span id="intentCount">${s.intent.length}</span>/400</span></div></div><div class="stack"><button class="btn primary" data-action="continue-intent">Continue</button><button class="btn secondary" data-action="skip-intent">Skip for now</button><button class="btn quiet" data-action="cancel">I no longer need help</button></div>`);if(s.step===4){const related=/transfer|debit|pos|atm|payment|money|transaction|card/i.test(s.intent);return frame(`<p class="eyebrow">Visit context</p><h2>${related?'Is one of these related?':'Ready for your visit.'}</h2><p class="lead">${related?'Linking a transaction is optional.':'Your original wording stays attached to the visit.'}</p>${s.intent?`<div class="soft"><b>Your reason</b><br>${esc(s.intent)}</div>`:''}${related?`<button class="tx ${s.tx==='t1'?'selected':''}" data-tx="t1"><span class="radio"></span><span class="txCopy"><b>Transfer to Chinedu</b><small>Today, 8:41 AM · Pending</small></span><strong>₦75,000</strong></button><button class="tx ${s.tx==='t2'?'selected':''}" data-tx="t2"><span class="radio"></span><span class="txCopy"><b>POS payment</b><small>Yesterday, 6:20 PM · Successful</small></span><strong>₦12,500</strong></button>`:''}<div class="stack"><button class="btn primary" data-action="start-visit">Continue to branch visit</button>${related?'<button class="btn secondary" data-action="no-tx">No related transaction</button>':''}<button class="btn quiet" data-action="edit-intent">Edit my reason</button></div>`)}if(s.step===5){s.visitStart??=Date.now();frame(`<p class="eyebrow">Visit in progress</p><h2>Corri has noted your visit.</h2><p class="lead">Receive service normally. When you leave, Corri checks whether the issue was resolved.</p><div class="timer" id="timer">00:00</div><div class="card"><div class="row"><span class="label">Branch</span><span class="value">Wema Marina</span></div><div class="row"><span class="label">Reason</span><span class="value">${esc(s.intent||'General branch assistance')}</span></div></div><div class="stack"><button class="btn primary" data-action="left">Simulate leaving the branch</button><button class="btn quiet" data-action="cancel">Cancel this visit</button></div>`);updateTimer();visitTimer=setInterval(updateTimer,1000);return}if(s.step===6)return frame(`<div class="success">✓</div><p class="eyebrow">After the visit</p><h2>Did you get the help you needed?</h2><p class="lead">${esc(s.intent||'Your branch visit')}</p><div class="stack"><button class="btn primary" data-action="resolved">Yes, it was resolved</button><button class="btn secondary" data-action="unresolved">No, it is still unresolved</button><button class="btn quiet" data-action="unsure">I’m not sure yet</button></div>`);if(s.step===7)return frame(`<p class="eyebrow">Continue digitally</p><h2>What happened at the branch?</h2><p class="lead">Add the minimum useful context. Wema staff will review the case.</p><div class="field"><textarea id="outcome" maxlength="500" placeholder="Example: The branch said the transfer was still pending and asked me to return later.">${esc(s.outcome)}</textarea><div class="fieldFoot"><button class="voice" data-action="voice-outcome">Speak instead</button><span class="label"><span id="outcomeCount">${s.outcome.length}</span>/500</span></div></div><div class="stack"><button class="btn primary" data-action="create-case">Create my case</button><button class="btn secondary" data-action="save-draft">Save for later</button><button class="btn quiet" data-action="back-resolution">Back</button></div>`);if(s.step===8)return frame(`<div class="success">✓</div><p class="eyebrow">Case created</p><h2>You do not need to start again.</h2><div class="case"><span>Case reference</span><strong>WM-20481</strong><small>Human review required</small></div><div class="timeline"><div class="item"><b>Your statement was preserved</b><small>Your original wording stays attached</small></div><div class="item"><b>Visit context was attached</b><small>Corri did not invent a root cause</small></div><div class="item"><b>Routed for Wema review</b><small>Authorised staff decide the next action</small></div></div><div class="stack"><button class="btn primary" data-action="track">Track this case</button><button class="btn quiet" data-action="restart">Run the demo again</button></div>`);if(s.step===9)return frame(`<p class="eyebrow">My cases</p><h2>WM-20481</h2><div class="card"><div class="row"><div><b>${s.tx?'₦75,000 transfer issue':'Branch support case'}</b><div class="label">Under human review</div></div><span class="status">IN PROGRESS</span></div></div><div class="timeline"><div class="item"><b>Case created</b><small>Just now</small></div><div class="item"><b>Assigned for human review</b><small>Digital Banking Operations</small></div><div class="item"><b>Updates appear here</b></div></div><div class="stack"><button class="btn primary" data-action="restart">Run branch journey again</button><button class="btn secondary" data-action="home">Finish</button></div>`);if(s.step===10)return frame(`<div class="success">✓</div><p class="eyebrow">Resolved</p><h2>Your branch journey is complete.</h2><p class="lead">No follow-up case was created because the customer said the issue was resolved.</p><div class="stack"><button class="btn primary" data-action="restart">Run another visit</button><button class="btn secondary" data-action="home">Finish</button></div>`);if(s.step===11)return frame(`<p class="eyebrow">Saved</p><h2>Corri will not force a case yet.</h2><p class="lead">The visit is saved so the customer can decide later whether follow-up is needed.</p><div class="stack"><button class="btn primary" data-action="unresolved">It is unresolved after all</button><button class="btn secondary" data-action="resolved">It is resolved</button><button class="btn quiet" data-action="home">Finish for now</button></div>`)}function updateTimer(){const el=document.querySelector('#timer');if(!el)return;const n=Math.floor((Date.now()-(s.visitStart||Date.now()))/1000);el.textContent=`${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`}function voice(id,btn){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return toast('Voice input is not available here');const field=document.querySelector('#'+id);recognition=new SR();recognition.lang='en-NG';btn.textContent='Listening';recognition.onresult=e=>{field.value=(field.value+' '+e.results[0][0].transcript).trim();field.dispatchEvent(new Event('input',{bubbles:true}))};recognition.onend=()=>{btn.textContent='Speak instead';recognition=null};recognition.start()}document.addEventListener('input',e=>{if(e.target.id==='intent'){s.intent=e.target.value;document.querySelector('#intentCount').textContent=s.intent.length}if(e.target.id==='outcome'){s.outcome=e.target.value;document.querySelector('#outcomeCount').textContent=s.outcome.length}});document.addEventListener('click',e=>{const ab=e.target.closest('[data-alert]');if(ab){ab.dataset.alert==='help'?(closeAlert(),go(2)):dismiss(ab.dataset.alert);return}const tx=e.target.closest('[data-tx]');if(tx){s.tx=tx.dataset.tx;render();return}const b=e.target.closest('[data-action]');if(!b)return;unlock();const a=b.dataset.action;if(a==='demo'||a==='restart')startDemo();else if(a==='live')startLive();else if(a==='alert')openAlert();else if(a==='home'){clearInterval(approachTimer);stopGeo();closeAlert();s=initial();go(0)}else if(a==='help')go(3);else if(a==='later'){s.quietUntil=Date.now()+1800000;go(1);toast('Corri will stay quiet for 30 minutes')}else if(a==='away'){s.quietUntil=Date.now()+21600000;go(1);toast('Branch alerts paused for 6 hours')}else if(a==='continue-intent'){s.intent.trim().length<5?toast('Add a short reason, or skip for now'):go(4)}else if(a==='skip-intent'){s.intent='';s.tx=null;go(4)}else if(a==='cancel'){s.intent='';s.tx=null;s.visitStart=null;go(1)}else if(a==='start-visit'){s.visitStart=Date.now();go(5)}else if(a==='no-tx'){s.tx=null;s.visitStart=Date.now();go(5)}else if(a==='edit-intent')go(3);else if(a==='left')go(6);else if(a==='resolved')go(10);else if(a==='unresolved')go(7);else if(a==='unsure')go(11);else if(a==='create-case'){s.outcome.trim().length<5?toast('Add a short explanation, or save it for later'):(beep(),go(8))}else if(a==='save-draft'){go(11);toast('Saved for later')}else if(a==='back-resolution')go(6);else if(a==='track')go(9);else if(a==='voice-intent')voice('intent',b);else if(a==='voice-outcome')voice('outcome',b)});back.addEventListener('click',()=>{if(!layer.classList.contains('hidden'))return dismiss('later');const m={1:0,2:1,3:2,4:3,5:4,6:5,7:6,8:7,9:8,10:6,11:6};go(m[s.step]??0)});home.addEventListener('click',()=>{clearInterval(approachTimer);stopGeo();closeAlert();s=initial();go(0)});render();</script></body></html>
